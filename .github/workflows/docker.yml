name: Conditional Docker Image Builds
permissions:
  contents: read

on:
  push:
    paths:
      - 'docker/**'
      - 'docker-nfs/**'
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      build-standard: ${{ steps.filter.outputs.standard }}
      build-nfs: ${{ steps.filter.outputs.nfs }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine if builds are needed
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            standard:
              - 'docker/Dockerfile'
              - 'docker/sshd_config.standard'
              - 'docker/sshd_config.privileged'
              - 'docker/entrypoint.sh'
              - 'docker/sshkey.sh'
            nfs:
              - 'docker-nfs/Dockerfile'
              - 'docker-nfs/ganesha.conf'
              - 'docker-nfs/entrypoint.sh'

  build-standard:
    needs: filter
    if: needs.filter.outputs.build-standard == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::10}" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: bfenski
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push volume-exposer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bfenski/volume-exposer:latest
            bfenski/volume-exposer:${{ env.SHORT_SHA }}

  build-nfs:
    needs: filter
    if: needs.filter.outputs.build-nfs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::10}" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: bfenski
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push nfs-ganesha
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker-nfs
          file: ./docker-nfs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bfenski/nfs-ganesha:latest
            bfenski/nfs-ganesha:${{ env.SHORT_SHA }}
