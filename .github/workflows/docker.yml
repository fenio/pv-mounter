name: Conditional Docker Image Builds
permissions:
  contents: read

on:
  push:
    paths:
      - 'docker/**'
      - 'docker-nfs/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-26.04
    outputs:
      build-standard: ${{ steps.filter.outputs.standard }}
      build-nfs: ${{ steps.filter.outputs.nfs }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine if builds are needed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            standard:
              - 'docker/Dockerfile'
              - 'docker/sshd_config.standard'
              - 'docker/sshd_config.privileged'
              - 'docker/entrypoint.sh'
              - 'docker/sshkey.sh'
            nfs:
              - 'docker-nfs/Dockerfile'
              - 'docker-nfs/ganesha.conf'
              - 'docker-nfs/entrypoint.sh'

  build-standard:
    needs: filter
    if: github.event_name != 'push' || needs.filter.outputs.build-standard == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::10}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: bfenski
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push volume-exposer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bfenski/volume-exposer:latest
            bfenski/volume-exposer:${{ env.SHORT_SHA }}

  build-nfs:
    needs: filter
    if: github.event_name != 'push' || needs.filter.outputs.build-nfs == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::10}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: bfenski
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push nfs-ganesha
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker-nfs
          file: ./docker-nfs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bfenski/nfs-ganesha:latest
            bfenski/nfs-ganesha:${{ env.SHORT_SHA }}
